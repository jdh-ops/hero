<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14161c" />
    <title>hero</title>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="hero" />
    <style>
      html, body { margin: 0; height: 100%; background: #14161c; overflow: hidden; touch-action: none; overscroll-behavior: none; user-select: none; -webkit-user-select: none; }
      /* 노치·홈 표시줄을 피해서 게임 화면을 둠 */
      #game { position: fixed; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px);
        left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px); }
      #rotate { display: none; position: fixed; inset: 0; z-index: 10; background: #14161c; color: #e8e6e3;
        font: 16px/1.6 system-ui, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 16px; }
      /* 모바일은 세로 고정: 휴대폰을 가로로 돌리면 안내 */
      @media (orientation: landscape) and (pointer: coarse) and (max-height: 500px) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <div id="rotate">📱↻<br />화면을 세로로 돌려 주세요</div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
